<!doctype html><html lang="en-ZA"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Entriq</title><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./assets/styles.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="./index.html"><img src="./assets/logo.svg" alt="Entriq" width="140"></a><p class="eyebrow">Account registration</p><h1>Create your Entriq account</h1><form data-demo-form><label>Account type<select name="role"><option value="holder">Ticket holder</option><option value="provider">Raffle provider</option></select></label><label>Full name<input type="text" required autocomplete="name"></label><label>Email address<input type="email" required autocomplete="email"></label><label>Mobile number<input type="tel" required autocomplete="tel"></label><label>Password<input type="password" required autocomplete="new-password"></label><label><span><input type="checkbox" required> I accept the terms, privacy notice and required consent records.</span></label><button class="button" type="submit">Create account</button><p data-form-message hidden></p></form><p>Already registered? <a href="./login.html">Sign in</a></p></section></main><script src="./assets/app.js"></script></body></html>
